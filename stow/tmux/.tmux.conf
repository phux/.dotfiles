set -g default-terminal "tmux-256color"

set-option -g mouse on
unbind -n MouseDrag1Border
unbind -n MouseDrag1Pane

set -g base-index 1
setw -g pane-base-index 1

setw -g word-separators ' @"=()[]'
setw -ag word-separators "'"

# Show activity in background windows
setw -g monitor-activity on

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Use vi keybinds
setw -g mode-keys vi
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
set -s copy-command 'xclip -in -selection clipboard'
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel

bind -r a select-pane -t .+1 \;  resize-pane -Z

bind -n S-Up move-pane -h -t '.{up-of}'
bind -n S-Right move-pane -t '.{right-of}'
bind -n S-Left move-pane -t '.{left-of}'
bind -n S-down move-pane -h -t '.{down-of}'

set-option -g renumber-windows on
bind c new-window -c "#{pane_current_path}"

bind b set-option status
set -g status off

# swap windows
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

bind P paste-buffer

bind-key S command-prompt -p "send pane to:"  "join-pane -t '%%'"

set -g set-clipboard on

set -g status-interval 60
set-option -g automatic-rename-format '#{b:pane_current_path}'

# https://github.com/tmux/tmux/issues/353#issuecomment-294570322
set-option -s escape-time 10


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @plugin 'akohlbecker/aw-watcher-tmux'

# install tpm if not installed yet
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run -b '~/.tmux/plugins/tpm/tpm'

bind-key C-Down resize-pane -D 25
bind-key C-Up resize-pane -U 25
bind-key C-Left resize-pane -L 25
bind-key C-Right resize-pane -R 25

bind -n C-M-f copy-mode \; command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi C-M-f copy-mode \; command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

set -g set-titles on
set -g set-titles-string 'tmux:#S:#{b:pane_current_path}:#W'
